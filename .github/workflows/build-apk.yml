name: Build Medico Man APK

on:
  push:
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - icon-*.png
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets exist
        env:
          A: ${{ secrets.KEYSTORE_BASE64 }}
          B: ${{ secrets.KEYSTORE_PASSWORD }}
          C: ${{ secrets.KEY_ALIAS }}
          D: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in A B C D; do
            if [ -z "${!v}" ]; then echo "::error::Missing one of the 4 signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"; exit 1; fi
          done

      - name: Install dependencies
        run: npm install

      - name: Prepare web files (bundle PDF/Word libraries for offline use)
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          P=https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174
          M=https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0
          J=https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1
          H=https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1
          if curl -fsSL "$P/pdf.min.js" -o www/lib/pdf.min.js \
            && curl -fsSL "$P/pdf.worker.min.js" -o www/lib/pdf.worker.min.js \
            && curl -fsSL "$M/mammoth.browser.min.js" -o www/lib/mammoth.browser.min.js \
            && curl -fsSL "$J/jspdf.umd.min.js" -o www/lib/jspdf.umd.min.js \
            && curl -fsSL "$H/html2canvas.min.js" -o www/lib/html2canvas.min.js; then
            sed -i \
              -e "s#$P/pdf.min.js#lib/pdf.min.js#g" \
              -e "s#$P/pdf.worker.min.js#lib/pdf.worker.min.js#g" \
              -e "s#$M/mammoth.browser.min.js#lib/mammoth.browser.min.js#g" \
              -e "s#$J/jspdf.umd.min.js#lib/jspdf.umd.min.js#g" \
              -e "s#$H/html2canvas.min.js#lib/html2canvas.min.js#g" \
              www/index.html
            echo "Libraries bundled for offline use"
          else
            echo "Could not download libraries; keeping CDN links"
          fi

      - name: Create Android project
        run: |
          mkdir -p assets && cp icon-*.png assets/
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Add native "save to Download" plugin
        run: |
          D=android/app/src/main/java/com/medicoman/app
          cat > $D/SaveDownloadPlugin.java <<'JAVA'
          package com.medicoman.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "SaveDownload")
          public class SaveDownloadPlugin extends Plugin {
            @PluginMethod
            public void save(PluginCall call) {
              String name = call.getString("name");
              String data = call.getString("data");
              String mime = call.getString("mime", "application/octet-stream");
              if (name == null || data == null) { call.reject("missing name or data"); return; }
              try {
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                String where;
                if (Build.VERSION.SDK_INT >= 29) {
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                  ContentResolver r = getContext().getContentResolver();
                  Uri u = r.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  if (u == null) throw new Exception("could not create file");
                  try (OutputStream o = r.openOutputStream(u)) { o.write(bytes); }
                  where = "Download/" + name;
                } else {
                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  dir.mkdirs();
                  File f = new File(dir, name);
                  try (FileOutputStream o = new FileOutputStream(f)) { o.write(bytes); }
                  where = f.getAbsolutePath();
                }
                JSObject ret = new JSObject();
                ret.put("path", where);
                call.resolve(ret);
              } catch (Exception e) {
                call.reject(e.getMessage());
              }
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.medicoman.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SaveDownloadPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perm = '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n'
          if 'WRITE_EXTERNAL_STORAGE' not in s:
              s = s.replace('<application', perm + '    <application', 1)
              open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Fix status/navigation bar colors and icon contrast
        run: |
          python3 - <<'PY'
          import re, sys
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          add = (
              '        <item name="android:windowBackground">#EEF3F8</item>\n'
              '        <item name="android:windowLightStatusBar">true</item>\n'
              '        <item name="android:windowLightNavigationBar">true</item>\n'
          )
          m = re.search(r'(<style name="AppTheme\.NoActionBar"[^>]*>)(.*?)(</style>)', s, re.S)
          if not m:
              print('AppTheme.NoActionBar style not found'); sys.exit(1)
          s = s[:m.end(2)] + add + s[m.end(2):]
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Set version (always increases so it installs over the old one)
        run: |
          N=${{ github.run_number }}
          F=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.$N\"/" "$F"
          grep -E "versionCode|versionName" "$F"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign with the permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out MedicoMan.apk aligned.apk
          "$BT/apksigner" verify --print-certs MedicoMan.apk | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" MedicoMan.apk \
            --title "Medico Man v${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} from commit ${GITHUB_SHA::7}"
